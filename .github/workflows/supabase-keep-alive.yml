name: Supabase Keep-Alive (Anti-Pause Free Tier)

on:
  schedule:
    # Executa automaticamente a cada 3 dias às 08:00 UTC (impede pausa de 7 dias do Supabase Free)
    - cron: '0 8 */3 * *'
  workflow_dispatch:

jobs:
  ping-supabase:
    name: Ping Supabase REST API
    runs-on: ubuntu-latest
    steps:
      - name: Execute Keep-Alive Healthcheck Query
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Variáveis VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY não configuradas nos Secrets. Pulando ping."
            exit 0
          fi
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/dogs?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          echo "Supabase Keep-Alive HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "✓ Ping anti-pausa concluído com sucesso."
          else
            echo "⚠ Resposta inesperada do Supabase: HTTP $HTTP_STATUS"
            exit 1
          fi
